<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="1" stop-color="#0b2452"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#1460ff"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="800" rx="170" fill="url(#bg)"/>
  <circle cx="650" cy="130" r="250" fill="#1460ff" opacity=".10"/>
  <circle cx="150" cy="700" r="280" fill="#4f8cff" opacity=".06"/>

  <!-- Beyaz alt kol, A işaretine kontrast ve daha güçlü bir odak kazandırır. -->
  <g transform="translate(196 180) scale(4.1)" filter="url(#softShadow)">
    <path d="M0 80 47 0 92 80H72L47 36 21 80Z" fill="url(#blue)"/>
    <path d="M31 69H80L91 86H49Z" fill="#ffffff"/>
    <circle cx="98" cy="84" r="6.5" fill="#ffffff"/>
    <circle cx="98" cy="84" r="4" fill="#4f8cff"/>
  </g>
</svg>
